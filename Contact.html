<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us</title>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
 <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body{
            background: #fff5f0;
            color: #333;
            background:linear-gradient(to top, rgba(0,0,0,0.5)50%,rgba(0,0,0,0.5)50%), url(contact.jpg);
            background-position:center;
            background-size:cover;
        }
        header{
            color: orange;
            padding: 20px 0;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
        }
        .intro{
            font-size:22px;
            color:white;
            text-align:center;
            padding:20px;
        }
        .contact-container{
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(245, 129, 13, 0.2);
        }
        .contact-container h2{
            text-align: center;
            margin-bottom: 30px;
            color: #ff6600;
            font-size: 2em;
        }
        .contact-container form{
            display: flex;
            flex-direction: column;
        }
        .contact-container form input,
        .contact-container form textarea{
            padding: 12px;
            margin-bottom: 15px;
            border: 0.5px solid #ff6600;
            border-radius: 5px;
            font-size: 1em;
        }
        .contact-container form input[type="submit"]{
            background: #ff6600;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .contact-container form input[type="submit"]:hover{
            background: #ff9933;
        }
        .contact-info{
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            flex-wrap: wrap;
            text-align: center;
        }
        .contact-info div{
            margin: 10px;
        }
        .contact-info p{
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .contact-info i{
            font-size: 1.5em;
            color: #ff6600;
            margin-bottom: 5px;
        }
        footer{
            background: #141414;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 50px;
        }
        .social-icons a{
            color: white;
           padding-left: 14px;
           padding-top: 5px;
           transition: 0.3s ease;
           font-size: 35px;
           margin-left: 10px;
        }

        .social-icons a:hover{
             color:orange;
    
        }
        @media(max-width:700px){
            .contact-info{
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
<body>
        <header>Darshna Malhi - Contact Page</header>

    <div class="contact-container">
        <h2><i class="fas fa-envelope"></i> Get in Touch</h2>
        <img src="contact-us.jpg" alt="Contact Us" style="width:400px; margin:20px auto; display:block; border-radius:15px;">
        <p class="intro">You can contact us every day from 10 am to 6 pm and 24 hours via email or contact form.</p>
        <form action="#">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="5" placeholder="Your Message" required></textarea>
            <input type="submit" value="Send Message">
        </form>

        <div class="contact-info">
            <div>
                <i class="fas fa-phone"></i>
                <p>Phone Number: +92 3702736002</p>
            </div>
            <div>
                <i class="fas fa-envelope"></i>
                <p>Email: darshnamalhi3@gmail.com</p>
            </div>
            <div>
                <i class="fas fa-map-marker-alt"></i>
                <p>Address: Umerkot, Pakistan</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Darshna Malhi. All Rights Reserved.</p>
        <br>
        <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-google"></i></a>
      
    </div>
    </footer>
    
</body>
</html>
